; PlatformIO project for the MCZ Maestro BLE controller (ESP32-C3)
; Single headless target (no display): BLE <-> WiFi/MQTT bridge, display_none.cpp

[env:esp32-c3-devkitm-1]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; ESP32-C3-DevKitM-1 has 4 MB flash; huge_app.csv (3 MB app, no OTA) fits and leaves
; plenty of headroom for BLE+WiFi+MQTT+JSON without a display.
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSE_MQTT=1
    -DMQTT_MAX_PACKET_SIZE=1024
